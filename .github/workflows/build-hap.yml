name: Build APP and Release (signed + unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ErBWs/setup-ohos@v2 自动下载+缓存 HarmonyOS CLI tools（含 SDK/hvigorw/ohpm）
      # 26.0.0.821 = API 26，与工程 targetSdkVersion 26 匹配
      - name: Setup HarmonyOS CLI tools (API 26)
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true

      # 本地签名材料（p12/cer/p7b + material 加密材料）以 base64 存于 GitHub Secrets，
      # CI 中解码到 $RUNNER_TEMP/harmony-key 并改写 build-profile.json5 路径，实现与本地一致的 release 签名。
      - name: Restore local signing material
        env:
          LEGADO_P12_B64: ${{ secrets.LEGADO_P12_B64 }}
          LEGADO_CER_B64: ${{ secrets.LEGADO_CER_B64 }}
          LEGADO_P7B_B64: ${{ secrets.LEGADO_P7B_B64 }}
          LEGADO_MATERIAL_B64: ${{ secrets.LEGADO_MATERIAL_B64 }}
        run: |
          set -e
          KEY_DIR="$RUNNER_TEMP/harmony-key"
          mkdir -p "$KEY_DIR"
          echo "$LEGADO_P12_B64" | base64 -d > "$KEY_DIR/legado-harmony-release.p12"
          echo "$LEGADO_CER_B64" | base64 -d > "$KEY_DIR/阅读.cer"
          echo "$LEGADO_P7B_B64" | base64 -d > "$KEY_DIR/阅读Release.p7b"
          # tgz 内已含 material/ 前缀，解压到 KEY_DIR 即得 KEY_DIR/material/fd|ac|ce
          echo "$LEGADO_MATERIAL_B64" | base64 -d | tar -xz -C "$KEY_DIR"
          ls -la "$KEY_DIR" "$KEY_DIR/material"
          # 将 build-profile.json5 中三套 signingConfigs 的绝对路径改写为 CI 路径
          python3 - <<'EOF'
          import os, re
          p = 'build-profile.json5'
          s = open(p, encoding='utf-8').read()
          key_dir = os.path.join(os.environ['RUNNER_TEMP'], 'harmony-key')
          key_dir = key_dir.replace('\\', '/')
          s = s.replace('C:/harmony-key/', key_dir + '/')
          open(p, 'w', encoding='utf-8').write(s)
          print('signing paths rewritten to', key_dir)
          EOF
          # 校验改写结果
          grep -c "RUNNER_TEMP" build-profile.json5 || true

      - name: ohpm install
        run: |
          export DEVECO_SDK_HOME="$HOS_SDK_HOME"
          export PATH="$HOS_SDK_HOME/../bin:$PATH"
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm install --all

      - name: Set dynamic version by date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 版本号规则 1.MMDD.NN：MMDD 取构建日期（如 2026-10-09 -> 1.1009.xx）；NN 为当日构建序号，同日依次 .01/.02/.03，跨日重置 .01。
          # 序号依据仓库已发布 release 资产中当日同名 APP（signed/unsigned）的最大序号 +1 得出（查询 GitHub API releases）。
          # versionCode = "1"+MMDD+NN 视作十进制（1.1009.01 -> 1100901，同日随 NN 递增，跨日随 MMDD 递增）。
          python3 - <<'EOF'
          import datetime, re, json, os, urllib.request, urllib.error

          d = datetime.datetime.now()
          mmdd = d.strftime('%m%d')
          token = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')

          max_nn = 0
          if repo and token:
              page = 1
              while True:
                  url = 'https://api.github.com/repos/%s/releases?per_page=100&page=%d' % (repo, page)
                  req = urllib.request.Request(url, headers={
                      'Authorization': 'token ' + token,
                      'User-Agent': 'legado3-harmony-ci',
                      'Accept': 'application/vnd.github+json',
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          rels = json.load(resp)
                  except urllib.error.HTTPError as e:
                      print('release query failed status=%s, fallback nn=01' % e.code)
                      break
                  if not rels:
                      break
                  pat = re.compile(r'^reading\.hm\.o_1\.%s\.(\d{2})_(signed|unsigned)\.app$' % mmdd)
                  for rel in rels:
                      for a in rel.get('assets', []):
                          m = pat.match(a.get('name', ''))
                          if m:
                              max_nn = max(max_nn, int(m.group(1)))
                  if len(rels) < 100:
                      break
                  page += 1

          nn = max_nn + 1
          ver = "1." + mmdd + ".%02d" % nn
          code = int("1" + mmdd + "%02d" % nn)
          p = 'AppScope/app.json5'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'"versionCode"\s*:\s*\d+', '"versionCode": %d' % code, s)
          s = re.sub(r'"versionName"\s*:\s*"[^"]+"', '"versionName": "%s"' % ver, s)
          s = re.sub(r'"buildVersion"\s*:\s*"[^"]+"', '"buildVersion": "%d"' % code, s)
          open(p, 'w', encoding='utf-8').write(s)
          print('versionName=' + ver + ' versionCode=' + str(code))
          EOF

      - name: Build release APP (signed + unsigned)
        run: |
          export DEVECO_SDK_HOME="$HOS_SDK_HOME"
          export PATH="$HOS_SDK_HOME/../bin:$PATH"
          hvigorw --no-daemon --mode project -p product=release assembleApp

      - name: Collect APP
        id: collect
        run: |
          VERSION=$(python3 - <<'EOF'
          import re
          s = open('AppScope/app.json5', encoding='utf-8').read()
          m = re.search(r'"versionName"\s*:\s*"([^"]+)"', s)
          print(m.group(1) if m else 'dev')
          EOF
          )
          SIGNED="reading.hm.o_${VERSION}_signed.app"
          UNSIGNED="reading.hm.o_${VERSION}_unsigned.app"
          cp build/outputs/release/legado-harmony-release-signed.app "$SIGNED"
          cp build/outputs/release/legado-harmony-release-unsigned.app "$UNSIGNED"
          echo "SIGNED=$SIGNED" >> "$GITHUB_ENV"
          echo "UNSIGNED=$UNSIGNED" >> "$GITHUB_ENV"
          ls -lh "$SIGNED" "$UNSIGNED"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APP build #${{ github.run_number }}
          body: |
            自动构建的 release APP 双包：
            - signed：正式 release 签名包（AGC 测试分发用）
            - unsigned：未签名包
            - 提交: ${{ github.sha }}
            - 构建号: ${{ github.run_number }}
            - 触发: ${{ github.event_name }}
          files: |
            ${{ env.SIGNED }}
            ${{ env.UNSIGNED }}
          draft: false
          prerelease: true
