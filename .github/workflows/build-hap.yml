name: Build HAP and Release (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ErBWs/setup-ohos@v2 自动下载+缓存 HarmonyOS CLI tools（含 SDK/hvigorw/ohpm）
      # 26.0.0.821 = API 26，与工程 targetSdkVersion 26 匹配
      - name: Setup HarmonyOS CLI tools (API 26)
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true

      # 工程 signingConfigs 指向作者本机签名文件（绝对路径+密文），CI 不可用，剥离后产 unsigned HAP
      - name: Strip local signing config
        run: |
          python3 - <<'EOF'
          import re
          p = 'build-profile.json5'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'"signingConfigs"\s*:\s*\[.*?\],', '"signingConfigs": [],', s, flags=re.S)
          s = re.sub(r'\s*"signingConfig"\s*:\s*"[^"]*",?', '', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('signingConfigs stripped')
          EOF

      - name: ohpm install
        run: |
          export DEVECO_SDK_HOME="$HOS_SDK_HOME"
          export PATH="$HOS_SDK_HOME/../bin:$PATH"
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm install --all

      - name: Set dynamic version by date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 版本号规则 1.MMDD.NN：MMDD 取构建日期（如 2026-10-02 -> 1.1002.xx）；NN 为当日构建序号，同日依次 .01/.02/.03，跨日重置 .01。
          # 序号依据仓库已发布 release 资产中当日同名 HAP 的最大序号 +1 得出（查询 GitHub API releases）。
          # versionCode = "1"+MMDD+NN 视作十进制（1.1002.01 -> 1100201，同日随 NN 递增，跨日随 MMDD 递增）。
          python3 - <<'EOF'
          import datetime, re, json, os, urllib.request, urllib.error

          d = datetime.datetime.now()
          mmdd = d.strftime('%m%d')
          token = os.environ.get('GH_TOKEN', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')

          max_nn = 0
          if repo and token:
              page = 1
              while True:
                  url = 'https://api.github.com/repos/%s/releases?per_page=100&page=%d' % (repo, page)
                  req = urllib.request.Request(url, headers={
                      'Authorization': 'token ' + token,
                      'User-Agent': 'legado3-harmony-ci',
                      'Accept': 'application/vnd.github+json',
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          rels = json.load(resp)
                  except urllib.error.HTTPError as e:
                      print('release query failed status=%s, fallback nn=01' % e.code)
                      break
                  if not rels:
                      break
                  pat = re.compile(r'^lagado\.hm\.app_1\.%s\.(\d{2})\.hap$' % mmdd)
                  for rel in rels:
                      for a in rel.get('assets', []):
                          m = pat.match(a.get('name', ''))
                          if m:
                              max_nn = max(max_nn, int(m.group(1)))
                  if len(rels) < 100:
                      break
                  page += 1

          nn = max_nn + 1
          ver = "1." + mmdd + ".%02d" % nn
          code = int("1" + mmdd + "%02d" % nn)
          p = 'AppScope/app.json5'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'"versionCode"\s*:\s*\d+', '"versionCode": %d' % code, s)
          s = re.sub(r'"versionName"\s*:\s*"[^"]+"', '"versionName": "%s"' % ver, s)
          s = re.sub(r'"buildVersion"\s*:\s*"[^"]+"', '"buildVersion": "%d"' % code, s)
          open(p, 'w', encoding='utf-8').write(s)
          print('versionName=' + ver + ' versionCode=' + str(code))
          EOF

      - name: Build debug HAP (unsigned)
        run: |
          export DEVECO_SDK_HOME="$HOS_SDK_HOME"
          export PATH="$HOS_SDK_HOME/../bin:$PATH"
          hvigorw --no-daemon assembleHap --mode module -p module=entry@default -p product=default -p buildMode=debug

      - name: Collect HAP
        id: collect
        run: |
          HAP=$(find entry/build -name '*.hap' | head -1)
          if [ -z "$HAP" ]; then
            echo "::error::No HAP found under entry/build"
            exit 1
          fi
          # 出包文件名按包名：lagado.hm.app_<versionName>.hap（版本号规则 1.MMDD.NN，见 AppScope/app.json5 注释）
          VERSION=$(python3 - <<'EOF'
          import re
          s = open('AppScope/app.json5', encoding='utf-8').read()
          m = re.search(r'"versionName"\s*:\s*"([^"]+)"', s)
          print(m.group(1) if m else 'dev')
          EOF
          )
          OUT="lagado.hm.app_${VERSION}.hap"
          cp "$HAP" "$OUT"
          echo "HAP=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: unsigned HAP build #${{ github.run_number }}
          body: |
            自动构建的 unsigned HAP（未签名，侧载用）。
            - 提交: ${{ github.sha }}
            - 构建号: ${{ github.run_number }}
            - 触发: ${{ github.event_name }}
          files: ${{ env.HAP }}
          draft: false
          prerelease: true
